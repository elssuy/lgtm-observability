apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: k8s-monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: k8s-monitoring
    targetRevision: 2.0.0-rc.3
    helm:
      values: |
        cluster: 
          name: admin

        destinations:
          - name: prometheus
            type: prometheus
            url: http://mimir-gateway.mimir/api/v1/push
            tenantId: admin
          - name: loki
            type: loki
            url: http://loki-gateway.loki/loki/api/v1/push
            tenantId: admin
          - name: tempo
            type: otlp
            url: http://tempo-distributor.tempo:4317/v1/traces
            traces:  { enabled: true }

        clusterMetrics:
          enabled: true
          apiServer:
            enabled: true
          cadvisor:
            enabled: true
          controlPlane:
            enabled: true
          kube-state-metrics:
            deploy: true
            enabled: true
          kubeControllerManager:
            enabled: true
          kubeProxy:
            enabled: true
          kubeScheduler:
            enabled: true
          kubeletResource:
            enabled: true
          node-exporter:
            enabled: true
            metricsTuning:
              useIntegrationAllowList: true

        clusterEvents:
          enabled: true
        podLogs:
          enabled: true
        prometheusOperatorObjects:
          enabled: true
        applicationObservability:
          enabled: true
          receivers:
            grpc:
              enabled: true

        alloy-metrics:
          enabled: true
        alloy-singleton:
          enabled: true
        alloy-logs:
          enabled: true
        alloy-receiver:
          enabled: true
          alloy:
            extraPorts:
              - name: otlp-grpc
                port: 4317
                targetPort: 4317
                protocol: TCP

  destination:
    server: https://kubernetes.default.svc
    namespace: k8s-monitoring
  syncPolicy:
    automated: {}
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
